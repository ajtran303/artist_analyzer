version: "3.8"

services:
  web:
    build: .
    ports:
      - "5000:5000"
    environment:
      - FLASK_ENV=production
      - DATABASE_URL=postgresql://analyzer_user:${DB_PASSWORD}@db:5432/artist_analyzer
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - DISCOGS_API_TOKEN=${DISCOGS_API_TOKEN}
      - SECRET_KEY=${SECRET_KEY}
      - CORS_ORIGINS=${CORS_ORIGINS:-*}
      - FORCE_HTTPS=false
      - PYTHONPATH=/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      gunicorn app:app
      --bind 0.0.0.0:5000
      --workers 4
      --timeout 120
      --access-logfile -
      --error-logfile -
      --log-level info
      --max-requests 1000
      --max-requests-jitter 100
      --graceful-timeout 30
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 128M
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:5000/api/health', timeout=5)",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped

  worker:
    build: .
    environment:
      - FLASK_ENV=production
      - DATABASE_URL=postgresql://analyzer_user:${DB_PASSWORD}@db:5432/artist_analyzer
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - DISCOGS_API_TOKEN=${DISCOGS_API_TOKEN}
      - SECRET_KEY=${SECRET_KEY}
      - PYTHONPATH=/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      celery -A celery_app.celery worker
      --loglevel=info
      --concurrency=2
      --max-tasks-per-child=1000
      --time-limit=3600
      --soft-time-limit=3300
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
        reservations:
          cpus: "0.25"
          memory: 256M
    restart: unless-stopped

  db:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=analyzer_user
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=artist_analyzer
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U analyzer_user -d artist_analyzer"]
      interval: 5s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
        reservations:
          cpus: "0.1"
          memory: 64M
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command:
      [
        "redis-server",
        "--requirepass",
        "${REDIS_PASSWORD}",
        "--appendonly",
        "yes",
      ]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M
        reservations:
          cpus: "0.1"
          memory: 32M
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
