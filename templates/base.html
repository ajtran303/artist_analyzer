<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block title %}Lyrical Analysis{% endblock %}</title>
    <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='music_note.svg') }}" />
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='style.css') }}"
    />
    {% block head %}{% endblock %}
  </head>
  <body>
    <a href="#main-content" class="skip-link">Skip to main content</a>

    <nav class="navbar" role="navigation" aria-label="Main navigation">
      <div class="nav-container">
        <a href="/" class="nav-logo">Lyrical Analysis</a>
      </div>
    </nav>

    <main id="main-content" class="container" role="main">{% block content %}{% endblock %}</main>

    <footer class="footer" role="contentinfo">
      <p>Powered by LDA, TextBlob Sentiment Analysis, and NRC Emotion Lexicon</p>
    </footer>

    {% block scripts %}{% endblock %}
  </body>
</html>
